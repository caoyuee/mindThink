[package]
name = "desktop-naotu"
version = "0.1.0"
description = "DesktopNaotu - Modern mind map desktop app"
authors = ["NaoTu Team"]
edition = "2021"
rust-version = "1.77"
default-run = "desktop-naotu"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/

[lib]
name = "desktop_naotu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "1"
tokio = { version = "1", features = ["fs"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
incremental = false
