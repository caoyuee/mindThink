name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify (typecheck + lint + format + test + build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 不传 version：pnpm/action-setup 自动采用根 package.json 的
      # "packageManager": "pnpm@12.18.0"，避免 Multiple versions of pnpm specified。
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Upload coverage
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: apps/*/coverage/
          retention-days: 7
