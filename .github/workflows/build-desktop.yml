name: Build Desktop

# 只打包桌面客户端（tauri-spike）。Web 端无需打包，legacy/ 为只读存档。
#
# 触发方式：
#   1. push tag `v*`    -> 构建并在 GitHub Releases 发布安装包
#   2. 手动 dispatch    -> 仅构建并上传 artifact，用于日常验证打包链路
#
# 发布命令：
#   git tag v0.1.0 && git push origin v0.1.0
#
# 后续启用 macOS（M5 发布工程）：在 matrix 追加
#   - os: macos-latest
#     platform: macos
# 并补充 artifact 路径：
#   tauri-spike/src-tauri/target/release/bundle/dmg/*.dmg
#   tauri-spike/src-tauri/target/release/bundle/macos/*.app.tar.gz

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          # ubuntu-latest = 24.04：libwebkit2gtk-4.1 / libayatana-appindicator3
          # 包名一致；libfuse2 与 libfuse2t64 已做自适应。
          - os: ubuntu-latest
            platform: linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Frontend parity guard (shared src must not drift)
        if: matrix.platform == 'linux'
        run: node scripts/check-frontend-parity.mjs

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            rpm \
            wget
          if apt-cache show libfuse2 >/dev/null 2>&1; then
            sudo apt-get install -y libfuse2
          else
            sudo apt-get install -y libfuse2t64
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: tauri-spike/pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: tauri-spike/src-tauri

      - name: Install frontend dependencies
        working-directory: tauri-spike
        run: pnpm install --frozen-lockfile

      # 前置会自动执行 beforeBuildCommand（pnpm build = vue-tsc -b && vite build），
      # 类型检查失败会直接中断打包。
      - name: Build desktop bundles
        working-directory: tauri-spike
        run: pnpm tauri build

      - name: Upload Windows bundles
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-x64
          if-no-files-found: error
          path: |
            tauri-spike/src-tauri/target/release/bundle/nsis/*.exe
            tauri-spike/src-tauri/target/release/bundle/msi/*.msi

      - name: Upload Linux bundles
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-x64
          if-no-files-found: error
          path: |
            tauri-spike/src-tauri/target/release/bundle/deb/*.deb
            tauri-spike/src-tauri/target/release/bundle/rpm/*.rpm
            tauri-spike/src-tauri/target/release/bundle/appimage/*.AppImage

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    # 仅 tag push 发布；手动 dispatch 只上传 artifact，不发 Release
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download built bundles
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: release-assets/**/*
          fail_on_unmatched_files: true
