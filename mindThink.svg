<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    
    <!-- 节点发光效果 -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- 阴影 -->
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 圆角方形背景 -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- 中心主节点 -->
  <circle cx="256" cy="256" r="48" fill="#ffffff" opacity="0.95" filter="url(#glow)"/>
  <text x="256" y="262" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" fill="#764ba2" dominant-baseline="middle">M</text>

  <!-- 连接线 -->
  <g stroke="#ffffff" stroke-width="3" opacity="0.5" fill="none" stroke-linecap="round">
    <!-- 左上分支 -->
    <path d="M 216 224 Q 160 180 128 140" />
    <!-- 右上分支 -->
    <path d="M 296 224 Q 352 180 384 140" />
    <!-- 左下分支 -->
    <path d="M 216 288 Q 160 332 128 372" />
    <!-- 右下分支 -->
    <path d="M 296 288 Q 352 332 384 372" />
    <!-- 左侧分支 -->
    <path d="M 210 256 Q 160 256 110 256" />
    <!-- 右侧分支 -->
    <path d="M 302 256 Q 352 256 402 256" />
  </g>

  <!-- 子节点 -->
  <g filter="url(#glow)">
    <!-- 左上子节点 -->
    <rect x="90" y="105" width="76" height="50" rx="12" fill="#ffffff" opacity="0.9"/>
    <text x="128" y="135" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#667eea" font-weight="bold" dominant-baseline="middle">Idea</text>
    
    <!-- 右上子节点 -->
    <rect x="346" y="105" width="76" height="50" rx="12" fill="#ffffff" opacity="0.9"/>
    <text x="384" y="135" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#667eea" font-weight="bold" dominant-baseline="middle">Plan</text>
    
    <!-- 左下子节点 -->
    <rect x="90" y="350" width="76" height="50" rx="12" fill="#ffffff" opacity="0.9"/>
    <text x="128" y="380" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#667eea" font-weight="bold" dominant-baseline="middle">Task</text>
    
    <!-- 右下子节点 -->
    <rect x="346" y="350" width="76" height="50" rx="12" fill="#ffffff" opacity="0.9"/>
    <text x="384" y="380" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#667eea" font-weight="bold" dominant-baseline="middle">Note</text>
    
    <!-- 左侧子节点 -->
    <rect x="72" y="228" width="76" height="50" rx="12" fill="#ffffff" opacity="0.9"/>
    <text x="110" y="258" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#667eea" font-weight="bold" dominant-baseline="middle">Link</text>
    
    <!-- 右侧子节点 -->
    <rect x="364" y="228" width="76" height="50" rx="12" fill="#ffffff" opacity="0.9"/>
    <text x="402" y="258" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#667eea" font-weight="bold" dominant-baseline="middle">View</text>
  </g>

  <!-- 装饰性小圆点（连接点） -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="160" cy="180" r="4"/>
    <circle cx="352" cy="180" r="4"/>
    <circle cx="160" cy="332" r="4"/>
    <circle cx="352" cy="332" r="4"/>
    <circle cx="160" cy="256" r="4"/>
    <circle cx="352" cy="256" r="4"/>
  </g>

  <!-- 应用名称 -->
  <text x="256" y="470" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="bold" fill="#ffffff" opacity="0.95" letter-spacing="1">mindThink</text>
</svg>