<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea" />
      <stop offset="100%" stop-color="#764ba2" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- 圆角方形背景 -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#bgGrad)" />

  <!-- 连接线 -->
  <g stroke="#ffffff" stroke-width="10" opacity="0.55" fill="none" stroke-linecap="round">
    <path d="M 216 224 Q 160 180 128 140" />
    <path d="M 296 224 Q 352 180 384 140" />
    <path d="M 216 288 Q 160 332 128 372" />
    <path d="M 296 288 Q 352 332 384 372" />
    <path d="M 210 256 Q 160 256 110 256" />
    <path d="M 302 256 Q 352 256 402 256" />
  </g>

  <!-- 分支节点 -->
  <g fill="#ffffff" opacity="0.92" filter="url(#glow)">
    <circle cx="128" cy="140" r="26" />
    <circle cx="384" cy="140" r="26" />
    <circle cx="128" cy="372" r="26" />
    <circle cx="384" cy="372" r="26" />
    <circle cx="110" cy="256" r="26" />
    <circle cx="402" cy="256" r="26" />
  </g>

  <!-- 中心主节点 -->
  <circle cx="256" cy="256" r="52" fill="#ffffff" opacity="0.97" filter="url(#glow)" />
  <circle cx="256" cy="256" r="24" fill="#764ba2" />
</svg>
